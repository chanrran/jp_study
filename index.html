<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>일본어 공부</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    .subtitle { font-size: 1.1rem; color: #666; margin-bottom: 2rem; }
    .status {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    .check { font-size: 3rem; margin-bottom: 12px; }
    .status p { color: #555; line-height: 1.6; }
  </style>
</head>
<body>
  <h1>日本語 공부</h1>
  <p class="subtitle">일본어 학습 웹앱</p>
  <div class="status">
    <div class="check">✅</div>
    <p>GitHub Pages 배포 성공!<br>이 화면이 보이면 정상입니다.</p>
  </div>
</body>
</html>
