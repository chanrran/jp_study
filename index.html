<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>일본어 공부</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafaf9;
      --bg-card: #ffffff;
      --bg-nav: rgba(255,255,255,0.92);
      --fg: #1c1917;
      --fg-secondary: #78716c;
      --fg-tertiary: #a8a29e;
      --accent: #dc2626;
      --accent-soft: #fef2f2;
      --accent-text: #dc2626;
      --border: #e7e5e4;
      --border-strong: #d6d3d1;
      --tag-bg: #f5f5f4;
      --tag-fg: #57534e;
      --highlight: #fef9c3;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
      --radius: 12px;
      --radius-sm: 8px;
      --font-jp: 'Noto Sans JP', sans-serif;
      --font-kr: 'Noto Sans KR', sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #1c1917;
        --bg-card: #292524;
        --bg-nav: rgba(28,25,23,0.92);
        --fg: #fafaf9;
        --fg-secondary: #a8a29e;
        --fg-tertiary: #78716c;
        --accent: #ef4444;
        --accent-soft: #451a03;
        --accent-text: #fca5a5;
        --border: #44403c;
        --border-strong: #57534e;
        --tag-bg: #44403c;
        --tag-fg: #d6d3d1;
        --highlight: #422006;
        --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
        --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #1c1917;
      --bg-card: #292524;
      --bg-nav: rgba(28,25,23,0.92);
      --fg: #fafaf9;
      --fg-secondary: #a8a29e;
      --fg-tertiary: #78716c;
      --accent: #ef4444;
      --accent-soft: #451a03;
      --accent-text: #fca5a5;
      --border: #44403c;
      --border-strong: #57534e;
      --tag-bg: #44403c;
      --tag-fg: #d6d3d1;
      --highlight: #422006;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
      color-scheme: dark;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-kr);
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Page container ─── */
    .page { display: none; min-height: 100vh; padding-bottom: 80px; }
    .page.active { display: block; }

    /* ─── Bottom nav ─── */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--bg-nav);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex; justify-content: center; gap: 0;
      padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px));
      z-index: 100;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 6px 14px; border-radius: var(--radius-sm);
      background: none; border: none; color: var(--fg-tertiary);
      font-family: var(--font-kr); font-size: 11px; font-weight: 500;
      cursor: pointer; transition: color 0.15s;
    }
    .nav-item.active { color: var(--accent-text); }
    .nav-item svg { width: 22px; height: 22px; }

    /* ─── Home page ─── */
    .home-header {
      padding: 48px 20px 24px;
      text-align: center;
    }
    .home-header h1 {
      font-family: var(--font-jp);
      font-size: 2rem; font-weight: 700;
      letter-spacing: -0.02em;
    }
    .home-header h1 span { color: var(--accent); }
    .home-header p {
      margin-top: 6px;
      color: var(--fg-secondary); font-size: 0.9rem;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 16px 20px;
      max-width: 480px; margin: 0 auto;
    }
    .menu-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 16px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s;
      box-shadow: var(--shadow-sm);
      text-decoration: none; color: inherit;
    }
    .menu-card:active { transform: scale(0.97); }
    .menu-card .icon { font-size: 2rem; margin-bottom: 8px; }
    .menu-card .label {
      font-size: 0.95rem; font-weight: 600;
    }
    .menu-card .sub {
      font-size: 0.75rem; color: var(--fg-secondary);
      margin-top: 4px;
    }
    .menu-card.disabled {
      opacity: 0.4; pointer-events: none;
    }

    /* ─── Progress bar (home) ─── */
    .progress-section {
      padding: 16px 20px;
      max-width: 480px; margin: 0 auto;
    }
    .progress-section h3 {
      font-size: 0.85rem; font-weight: 600;
      color: var(--fg-secondary);
      margin-bottom: 10px;
    }
    .progress-bar-track {
      height: 6px; background: var(--border);
      border-radius: 3px; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; background: var(--accent);
      border-radius: 3px; transition: width 0.3s;
    }
    .progress-stats {
      display: flex; justify-content: space-between;
      font-size: 0.75rem; color: var(--fg-tertiary);
      margin-top: 6px;
    }

    /* ─── Hiragana page ─── */
    .sub-header {
      background: var(--bg);
      padding: 10px 16px 4px;
      display: flex; align-items: center; gap: 10px;
    }
    .back-btn {
      background: none; border: none; color: var(--fg);
      cursor: pointer; padding: 4px; display: flex;
    }
    .back-btn svg { width: 18px; height: 18px; }
    .sub-header h2 {
      font-size: 1rem; font-weight: 600;
      flex: 1;
    }

    /* Row filter tabs */
    .filter-bar {
      display: flex; gap: 5px; overflow-x: auto;
      padding: 4px 16px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-btn {
      flex-shrink: 0;
      padding: 4px 11px; border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--bg-card); color: var(--fg-secondary);
      font-family: var(--font-jp); font-size: 0.8rem; font-weight: 500;
      cursor: pointer; white-space: nowrap;
      transition: all 0.12s;
    }
    .filter-btn.active {
      background: var(--accent); color: #fff;
      border-color: var(--accent);
    }
    .level-tab {
      font-family: var(--font-ui); font-weight: 600; font-size: 0.85rem;
      padding: 6px 14px;
    }
    .level-tab .level-count {
      font-size: 0.7rem; opacity: 0.8; margin-left: 2px;
    }
    .level-tab.active .level-count { opacity: 1; }
    .filter-divider {
      flex-shrink: 0;
      width: 1px; height: 20px;
      background: var(--border-strong);
      margin: 0 2px;
      align-self: center;
    }

    /* Character list */
    .char-list {
      padding: 0 16px 20px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      max-width: 900px; margin: 0 auto;
    }
    @media (max-width: 640px) {
      .char-list {
        grid-template-columns: 1fr;
        max-width: 600px;
      }
    }

    /* Single character card — reference style, all info visible */
    .char-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .char-card-main {
      display: flex; gap: 16px; padding: 16px;
      align-items: flex-start;
    }

    .char-left {
      display: flex; flex-direction: column; align-items: center;
      min-width: 88px; gap: 4px;
    }
    .stroke-box {
      width: 88px; height: 88px;
      position: relative;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      overflow: hidden;
      cursor: pointer;
    }
    .stroke-box svg.acjk {
      width: 100%; height: 100%;
      display: block;
    }
    /* animCJK의 획 색상을 테마에 맞게 */
    .stroke-box svg.acjk path[id] { fill: var(--border); }
    .stroke-box svg.acjk path[clip-path] { stroke: var(--fg); }
    .stroke-box .replay-hint {
      position: absolute; bottom: 4px; right: 6px;
      font-size: 0.85rem; color: var(--fg-tertiary);
      cursor: pointer; opacity: 0.6;
      line-height: 1; pointer-events: auto;
    }
    .stroke-box .replay-hint:hover { opacity: 1; }
    .char-left .katakana {
      font-family: var(--font-jp);
      font-size: 1.1rem; font-weight: 400;
      color: var(--fg-tertiary);
    }
    /* 요음 등 SVG 없는 경우 텍스트 폴백 */
    .char-text-fallback {
      width: 88px; height: 88px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-jp);
      font-size: 3.2rem; font-weight: 300;
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
    }
    /* 요음(2글자 결합) */
    .char-text-fallback.combo {
      font-size: 2.2rem;
      letter-spacing: -0.05em;
    }

    .char-info { flex: 1; min-width: 0; }
    .char-info-row {
      display: flex; align-items: baseline; gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }
    .hangul-reading {
      font-size: 1.4rem; font-weight: 700;
      color: var(--accent-text);
    }
    .romaji {
      font-size: 0.9rem; color: var(--fg-secondary);
    }
    .type-tag {
      display: inline-block;
      padding: 2px 8px; border-radius: 4px;
      font-size: 0.7rem; font-weight: 600;
      background: var(--tag-bg); color: var(--tag-fg);
    }
    .type-tag.탁음 { background: #dbeafe; color: #1e40af; }
    .type-tag.반탁음 { background: #f3e8ff; color: #7c3aed; }
    .type-tag.요음 { background: #fef3c7; color: #92400e; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .type-tag.탁음 { background: #1e3a5f; color: #93c5fd; }
      :root:not([data-theme="light"]) .type-tag.반탁음 { background: #3b1f6e; color: #c4b5fd; }
      :root:not([data-theme="light"]) .type-tag.요음 { background: #451a03; color: #fcd34d; }
    }
    :root[data-theme="dark"] .type-tag.탁음 { background: #1e3a5f; color: #93c5fd; }
    :root[data-theme="dark"] .type-tag.반탁음 { background: #3b1f6e; color: #c4b5fd; }
    :root[data-theme="dark"] .type-tag.요음 { background: #451a03; color: #fcd34d; }

    .mnemonic {
      font-size: 0.82rem; color: var(--fg-secondary);
      line-height: 1.5; margin-top: 4px;
    }

    .sample-word {
      display: inline-flex; align-items: baseline; gap: 6px;
      margin-top: 6px; padding: 4px 10px;
      background: var(--tag-bg); border-radius: var(--radius-sm);
      font-size: 0.82rem;
    }
    .sample-word .jp { font-family: var(--font-jp); font-weight: 500; }
    .sample-word .meaning { color: var(--fg-secondary); }

    /* Origin (etymology) section */
    .char-origin {
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      background: var(--accent-soft);
    }
    .origin-title {
      font-size: 0.72rem; font-weight: 600;
      color: var(--fg-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .origin-content {
      display: flex; align-items: baseline; gap: 10px;
      flex-wrap: wrap;
    }
    .origin-kanji {
      font-family: var(--font-jp);
      font-size: 1.8rem; font-weight: 400;
      color: var(--fg);
    }
    .origin-hanja {
      font-size: 1rem; font-weight: 600;
      color: var(--accent-text);
    }
    .origin-meaning {
      font-size: 0.82rem; color: var(--fg-secondary);
    }
    .origin-explain {
      width: 100%;
      font-size: 0.78rem; color: var(--fg-secondary);
      line-height: 1.5; margin-top: 4px;
    }

    /* Confusable */
    .confusable {
      border-top: 1px solid var(--border);
      padding: 8px 16px;
      font-size: 0.78rem; color: var(--fg-tertiary);
    }
    .confusable span {
      font-family: var(--font-jp);
      font-weight: 500; color: var(--fg-secondary);
    }

    /* Search */
    .search-bar {
      padding: 0 16px 2px;
    }
    .search-input {
      width: 100%; padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-card); color: var(--fg);
      font-family: var(--font-kr); font-size: 0.85rem;
      outline: none; transition: border-color 0.15s;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--fg-tertiary); }

    .count-label {
      padding: 4px 16px 6px;
      font-size: 0.75rem; color: var(--fg-tertiary);
    }

    /* Sticky top controls wrapper */
    .sticky-controls {
      position: sticky; top: 0; z-index: 50;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding-bottom: 2px;
    }

    /* ─── Kanji card specifics ─── */
    .kanji-reading-group {
      margin-top: 4px;
    }
    .kanji-reading-label {
      font-size: 0.68rem; font-weight: 600;
      color: var(--fg-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 2px;
    }
    .kanji-readings {
      display: flex; flex-wrap: wrap; gap: 4px;
    }
    .kanji-reading-tag {
      display: inline-flex; align-items: baseline; gap: 4px;
      padding: 2px 8px; border-radius: 4px;
      font-size: 0.78rem;
      background: var(--tag-bg);
    }
    .kanji-reading-tag .jp {
      font-family: var(--font-jp); font-weight: 500; color: var(--fg);
    }
    .kanji-reading-tag .kr {
      font-size: 0.72rem; color: var(--fg-secondary);
    }
    .kanji-reading-tag.onyomi {
      background: #dbeafe; color: #1e40af;
    }
    .kanji-reading-tag.onyomi .jp { color: #1e40af; }
    .kanji-reading-tag.onyomi .kr { color: #3b82f6; }
    .kanji-reading-tag.kunyomi {
      background: #dcfce7; color: #166534;
    }
    .kanji-reading-tag.kunyomi .jp { color: #166534; }
    .kanji-reading-tag.kunyomi .kr { color: #22c55e; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .kanji-reading-tag.onyomi { background: #1e3a5f; }
      :root:not([data-theme="light"]) .kanji-reading-tag.onyomi .jp { color: #93c5fd; }
      :root:not([data-theme="light"]) .kanji-reading-tag.onyomi .kr { color: #60a5fa; }
      :root:not([data-theme="light"]) .kanji-reading-tag.kunyomi { background: #14532d; }
      :root:not([data-theme="light"]) .kanji-reading-tag.kunyomi .jp { color: #86efac; }
      :root:not([data-theme="light"]) .kanji-reading-tag.kunyomi .kr { color: #4ade80; }
    }
    :root[data-theme="dark"] .kanji-reading-tag.onyomi { background: #1e3a5f; }
    :root[data-theme="dark"] .kanji-reading-tag.onyomi .jp { color: #93c5fd; }
    :root[data-theme="dark"] .kanji-reading-tag.onyomi .kr { color: #60a5fa; }
    :root[data-theme="dark"] .kanji-reading-tag.kunyomi { background: #14532d; }
    :root[data-theme="dark"] .kanji-reading-tag.kunyomi .jp { color: #86efac; }
    :root[data-theme="dark"] .kanji-reading-tag.kunyomi .kr { color: #4ade80; }

    .kanji-words {
      display: flex; flex-wrap: wrap; gap: 4px;
      margin-top: 6px;
    }
    .kanji-word-tag {
      display: inline-flex; align-items: baseline; gap: 4px;
      padding: 3px 8px; border-radius: var(--radius-sm);
      background: var(--tag-bg); font-size: 0.78rem;
    }
    .kanji-word-tag .jp {
      font-family: var(--font-jp); font-weight: 500;
    }
    .kanji-word-tag .rd {
      font-family: var(--font-jp); color: var(--fg-secondary);
      font-size: 0.72rem;
    }
    .kanji-word-tag .mn {
      color: var(--fg-tertiary); font-size: 0.72rem;
    }

    .kanji-meta {
      display: flex; gap: 6px; flex-wrap: wrap;
      margin-top: 2px;
    }
    .kanji-meta-tag {
      font-size: 0.7rem;
      padding: 1px 7px; border-radius: 4px;
      background: var(--tag-bg); color: var(--tag-fg);
      font-weight: 500;
    }
    .kanji-hanja {
      font-size: 1.3rem; font-weight: 700;
      color: var(--accent-text);
    }
    .kanji-meaning {
      font-size: 0.9rem; color: var(--fg-secondary);
      margin-left: 4px;
    }

    /* ─── Vocab styles ─── */
    .vocab-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 16px;
      box-shadow: var(--shadow-sm);
    }
    .vocab-card-top {
      display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
    }
    .vocab-word {
      font-family: var(--font-jp); font-size: 1.4rem; font-weight: 700;
      color: var(--fg);
    }
    .vocab-kanji {
      font-family: var(--font-jp); font-size: 1.0rem;
      color: var(--fg-secondary);
    }
    .vocab-meaning {
      font-size: 0.95rem; font-weight: 600; color: var(--accent-text);
      margin-top: 4px;
    }
    .vocab-meta {
      display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px;
    }
    .vocab-meta-tag {
      font-size: 0.7rem; padding: 1px 7px; border-radius: 4px;
      background: var(--tag-bg); color: var(--tag-fg); font-weight: 500;
    }
    .vocab-example {
      margin-top: 10px; padding: 10px 12px; border-radius: var(--radius-sm);
      background: var(--tag-bg); border-left: 3px solid var(--accent);
    }
    .vocab-example-ja {
      font-family: var(--font-jp); font-size: 0.92rem; font-weight: 500;
      color: var(--fg); line-height: 1.5;
    }
    .vocab-example-reading {
      font-family: var(--font-jp); font-size: 0.78rem;
      color: var(--fg-secondary); margin-top: 2px;
    }
    .vocab-example-ko {
      font-size: 0.82rem; color: var(--fg-secondary); margin-top: 4px;
    }

    /* Empty state */
    .empty-state {
      text-align: center; padding: 48px 20px;
      color: var(--fg-tertiary); font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- ═══ HOME PAGE ═══ -->
  <div id="page-home" class="page active">
    <div class="home-header">
      <h1>日本語 <span>공부</span></h1>
      <p>일본어 학습 웹앱 · JLPT N5→N1</p>
    </div>

    <div class="progress-section">
      <h3>전체 학습 진행률</h3>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="totalProgress" style="width:0%"></div>
      </div>
      <div class="progress-stats">
        <span id="progressLabel">0 / 0 항목 학습</span>
        <span id="progressPct">0%</span>
      </div>
    </div>

    <div class="menu-grid">
      <div class="menu-card" onclick="navigate('hiragana')">
        <div class="icon">あ</div>
        <div class="label">히라가나</div>
        <div class="sub">청음·탁음·반탁음·요음 104자</div>
      </div>
      <div class="menu-card" onclick="navigate('katakana')">
        <div class="icon">ア</div>
        <div class="label">카타카나</div>
        <div class="sub">청음·탁음·반탁음·요음 104자</div>
      </div>
      <div class="menu-card" onclick="navigate('kanji')">
        <div class="icon">漢</div>
        <div class="label">한자</div>
        <div class="sub">상용한자 N5~N2 980자</div>
      </div>
      <div class="menu-card" onclick="navigate('vocab')">
        <div class="icon">語</div>
        <div class="label">어휘</div>
        <div class="sub">N5~N2 필수 단어 692개</div>
      </div>
      <div class="menu-card disabled">
        <div class="icon">文</div>
        <div class="label">문법</div>
        <div class="sub">준비 중</div>
      </div>
      <div class="menu-card disabled">
        <div class="icon">話</div>
        <div class="label">회화</div>

  <script>
    // ─── State ───
    let hiraganaData = [];
    let katakanaData = [];
    let kanjiData = [];
    let currentRow = 'all';
    let currentRowKata = 'all';
    let currentFilter = 'all';
    let currentFilterKata = 'all';
    let currentCatKanji = 'all';
    let currentKanjiLevel = 'N5';
    let searchQuery = '';
    let searchQueryKata = '';
    let searchQueryKanji = '';
    let vocabData = [];
    let currentCatVocab = 'all';
    let currentVocabLevel = 'N5';
    let searchQueryVocab = '';

    // Vocab level data cache
    const vocabCache = {};

    // Kanji level data cache
    const kanjiCache = {};

    function getKanjiCategory(char) {
      const entry = kanjiData.find(k => k.char === char);
      return entry && entry.category ? entry.category : '기타';
    }

    // Load kanji data for a level (lazy)
    async function loadKanjiLevel(level) {
      if (kanjiCache[level]) {
        kanjiData = kanjiCache[level];
        buildKanjiCategoryFilter();
        renderListKanji();
        return;
      }
      const listEl = document.getElementById('charListKanji');
      listEl.innerHTML = '<div class="empty-state">불러오는 중...</div>';
      try {
        const resp = await fetch(`data/kanji_${level.toLowerCase()}.json`);
        const json = await resp.json();
        kanjiCache[level] = json.data;
        kanjiData = json.data;
        buildKanjiCategoryFilter();
        renderListKanji();
      } catch (e) {
        listEl.innerHTML = '<div class="empty-state">데이터를 불러올 수 없습니다.</div>';
      }
    }

    // Build category filter buttons from current kanjiData
    function buildKanjiCategoryFilter() {
      const cats = {};
      kanjiData.forEach(k => {
        const c = k.category || '기타';
        cats[c] = (cats[c] || 0) + 1;
      });
      const sorted = Object.entries(cats).sort((a, b) => b[1] - a[1]);
      const filterEl = document.getElementById('kanjiFilter');
      let html = '<button class="filter-btn active" data-cat="all">전체</button>';
      sorted.forEach(([cat, count]) => {
        html += `<button class="filter-btn" data-cat="${cat}">${cat}</button>`;
      });
      filterEl.innerHTML = html;
      currentCatKanji = 'all';
    }

    // Load vocab data for a level (lazy)
    async function loadVocabLevel(level) {
      if (vocabCache[level]) {
        vocabData = vocabCache[level];
        buildVocabCategoryFilter();
        renderListVocab();
        return;
      }
      const listEl = document.getElementById('vocabList');
      listEl.innerHTML = '<div class="empty-state">불러오는 중...</div>';
      try {
        const resp = await fetch(`data/vocab_${level.toLowerCase()}.json`);
        const json = await resp.json();
        vocabCache[level] = Array.isArray(json) ? json : json.data;
        vocabData = vocabCache[level];
        buildVocabCategoryFilter();
        renderListVocab();
      } catch (e) {
        listEl.innerHTML = '<div class="empty-state">데이터를 불러올 수 없습니다.</div>';
      }
    }

    // Build category filter buttons from current vocabData
    function buildVocabCategoryFilter() {
      const cats = {};
      vocabData.forEach(v => {
        const c = v.category || '기타';
        cats[c] = (cats[c] || 0) + 1;
      });
      const sorted = Object.entries(cats).sort((a, b) => b[1] - a[1]);
      const filterEl = document.getElementById('vocabFilter');
      let html = '<button class="filter-btn active" data-cat="all">전체</button>';
      sorted.forEach(([cat, count]) => {
        html += `<button class="filter-btn" data-cat="${cat}">${cat}</button>`;
      });
      filterEl.innerHTML = html;
      currentCatVocab = 'all';
    }

    // ─── Navigation ───
    function navigate(page) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('page-' + page).classList.add('active');
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      const navBtn = document.querySelector(`.nav-item[data-page="${page}"]`);
      if (navBtn) navBtn.classList.add('active');
      window.scrollTo(0, 0);
    }

    // Nav button clicks
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => navigate(btn.dataset.page));
    });

    // ─── Load data ───
    async function loadData() {
      try {
        const [hResp, kResp] = await Promise.all([
          fetch('data/hiragana.json'),
          fetch('data/katakana.json')
        ]);
        const hJson = await hResp.json();
        const kJson = await kResp.json();
        hiraganaData = hJson.data;
        katakanaData = kJson.data;
        renderList();
        renderListKata();
        // Load kanji N5 and vocab N5 as defaults
        await Promise.all([
          loadKanjiLevel('N5'),
          loadVocabLevel('N5')
        ]);
        updateProgress();
      } catch (e) {
        document.getElementById('charList').innerHTML =
          '<div class="empty-state">데이터를 불러올 수 없습니다.</div>';
      }
    }


    // ─── Shared card renderer ───
    function renderCard(c, counterpartKey) {
      const origin = c.origin && c.origin.kanji ? `
        <div class="char-origin">
          <div class="origin-title">유래 由来</div>
          <div class="origin-content">
            <span class="origin-kanji">${c.origin.kanji}</span>
            <span class="origin-hanja">${c.origin.hanja}</span>
            <span class="origin-meaning">${c.origin.meaning}</span>
            <div class="origin-explain">${c.origin.explanation}</div>
          </div>
        </div>` : '';

      const confusable = c.confusableWith && c.confusableWith.length > 0 ? `
        <div class="confusable">
          헷갈림 주의: <span>${c.confusableWith.join(' ')}</span>
        </div>` : '';

      const hasStrokeSvg = c.unicode != null;
      const comboClass = c.char.length > 1 ? ' combo' : '';
      const strokeArea = hasStrokeSvg
        ? `<div class="stroke-box" data-unicode="${c.unicode}">
             <span class="replay-hint" onclick="event.stopPropagation(); replayStroke(this.parentNode)">▶</span>
           </div>`
        : `<div class="char-text-fallback${comboClass}">${c.char}</div>`;

      const counterpart = c[counterpartKey] || '';

      return `
        <div class="char-card">
          <div class="char-card-main">
            <div class="char-left">
              ${strokeArea}
              <span class="katakana">${counterpart}</span>
            </div>
            <div class="char-info">
              <div class="char-info-row">
                <span class="hangul-reading">${c.hangul}</span>
                <span class="romaji">${c.romaji}</span>
                <span class="type-tag ${c.type}">${c.type} · ${c.row}행${c.strokeCount != null ? ' · ' + c.strokeCount + '획' : ''}</span>
              </div>
              <div class="mnemonic">${c.mnemonic}</div>
              ${c.sampleWord ? `
                <div class="sample-word">
                  <span class="jp">${c.sampleWord.reading}</span>
                  <span class="jp">${c.sampleWord.word}</span>
                  <span class="meaning">${c.sampleWord.meaning}</span>
                </div>` : ''}
            </div>
          </div>
          ${origin}
          ${confusable}
        </div>`;
    }

    // ─── Render hiragana (행 필터링) ───
    function renderList() {
      let filtered = hiraganaData;
      if (currentRow !== 'all') filtered = filtered.filter(c => c.row === currentRow);
      if (currentFilter !== 'all') filtered = filtered.filter(c => c.type === currentFilter);
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        filtered = filtered.filter(c =>
          c.char.includes(q) || c.hangul.includes(q) ||
          c.romaji.toLowerCase().includes(q) || (c.katakana && c.katakana.includes(q))
        );
      }
      document.getElementById('countLabel').textContent = `${filtered.length}자`;
      const listEl = document.getElementById('charList');
      if (filtered.length === 0) {
        listEl.innerHTML = '<div class="empty-state">검색 결과가 없습니다.</div>';
        return;
      }
      listEl.innerHTML = filtered.map(c => renderCard(c, 'katakana')).join('');
    }

    // ─── Render katakana (행 필터링) ───
    function renderListKata() {
      let filtered = katakanaData;
      if (currentRowKata !== 'all') filtered = filtered.filter(c => c.row === currentRowKata);
      if (currentFilterKata !== 'all') filtered = filtered.filter(c => c.type === currentFilterKata);
      if (searchQueryKata) {
        const q = searchQueryKata.toLowerCase();
        filtered = filtered.filter(c =>
          c.char.includes(q) || c.hangul.includes(q) ||
          c.romaji.toLowerCase().includes(q) || (c.hiragana && c.hiragana.includes(q))
        );
      }
      document.getElementById('countLabelKata').textContent = `${filtered.length}자`;
      const listEl = document.getElementById('charListKata');
      if (filtered.length === 0) {
        listEl.innerHTML = '<div class="empty-state">검색 결과가 없습니다.</div>';
        return;
      }
      listEl.innerHTML = filtered.map(c => renderCard(c, 'hiragana')).join('');
    }

    // ─── Kanji card renderer ───
    function renderKanjiCard(k) {
      const onyomiHtml = k.onyomi.length > 0
        ? k.onyomi.map(r => `<span class="kanji-reading-tag onyomi"><span class="jp">${r.reading}</span><span class="kr">${r.hangul}</span></span>`).join('')
        : '<span class="kanji-reading-tag" style="opacity:0.4">—</span>';

      const kunyomiHtml = k.kunyomi.length > 0
        ? k.kunyomi.map(r => `<span class="kanji-reading-tag kunyomi"><span class="jp">${r.reading}</span><span class="kr">${r.hangul}</span></span>`).join('')
        : '<span class="kanji-reading-tag" style="opacity:0.4">—</span>';

      const wordsHtml = k.words.map(w =>
        `<span class="kanji-word-tag"><span class="jp">${w.word}</span><span class="rd">${w.reading}</span><span class="mn">${w.meaning}</span></span>`
      ).join('');

      const cat = k.category || '기타';

      return `
        <div class="char-card">
          <div class="char-card-main">
            <div class="char-left">
              <div class="stroke-box" data-unicode="${k.unicode}" data-svg-dir="kanji-svg">
                <span class="replay-hint" onclick="event.stopPropagation(); replayStroke(this.parentNode)">▶</span>
              </div>
            </div>
            <div class="char-info">
              <div class="char-info-row">
                <span class="kanji-hanja">${k.hanja}</span>
                <span class="kanji-meaning">${k.meaning}</span>
              </div>
              <div class="kanji-meta">
                <span class="kanji-meta-tag">${k.strokeCount}획</span>
                ${k.radical ? `<span class="kanji-meta-tag">부수 ${k.radical} ${k.radicalName || ''}</span>` : ''}
                <span class="kanji-meta-tag">${cat}</span>
              </div>
              <div class="kanji-reading-group">
                <div class="kanji-reading-label">음독 おんよみ</div>
                <div class="kanji-readings">${onyomiHtml}</div>
              </div>
              <div class="kanji-reading-group">
                <div class="kanji-reading-label">훈독 くんよみ</div>
                <div class="kanji-readings">${kunyomiHtml}</div>
              </div>
              <div class="mnemonic">${k.mnemonic}</div>
              <div class="kanji-words">${wordsHtml}</div>
            </div>
          </div>
        </div>`;
    }

    // ─── Render kanji list ───
    function renderListKanji() {
      let filtered = kanjiData;
      if (currentCatKanji !== 'all') {
        filtered = filtered.filter(k => (k.category || '기타') === currentCatKanji);
      }
      if (searchQueryKanji) {
        const q = searchQueryKanji.toLowerCase();
        filtered = filtered.filter(k =>
          k.char.includes(q) ||
          k.hanja.includes(q) ||
          k.meaning.includes(q) ||
          k.onyomi.some(r => r.reading.toLowerCase().includes(q) || r.hangul.includes(q)) ||
          k.kunyomi.some(r => r.reading.toLowerCase().includes(q) || r.hangul.includes(q)) ||
          k.words.some(w => w.word.includes(q) || w.reading.includes(q) || w.meaning.includes(q))
        );
      }
      document.getElementById('countLabelKanji').textContent = `${filtered.length}자`;
      const listEl = document.getElementById('charListKanji');
      if (filtered.length === 0) {
        listEl.innerHTML = '<div class="empty-state">검색 결과가 없습니다.</div>';
        return;
      }
      listEl.innerHTML = filtered.map(k => renderKanjiCard(k)).join('');
    }

    // ─── Kanji level tabs ───
    document.getElementById('kanjiLevelTabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.level-tab');
      if (!btn || !btn.dataset.level) return;
      if (btn.classList.contains('active')) return;
      document.querySelectorAll('#kanjiLevelTabs .level-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentKanjiLevel = btn.dataset.level;
      searchQueryKanji = '';
      document.getElementById('searchInputKanji').value = '';
      loadKanjiLevel(currentKanjiLevel);
    });

    // ─── Kanji filter ───
    document.getElementById('kanjiFilter').addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn || btn.dataset.cat === undefined) return;
      const wasActive = btn.classList.contains('active') && btn.dataset.cat !== 'all';
      document.querySelectorAll('#kanjiFilter .filter-btn').forEach(b => b.classList.remove('active'));
      if (wasActive) {
        currentCatKanji = 'all';
        document.querySelector('#kanjiFilter .filter-btn[data-cat="all"]').classList.add('active');
      } else {
        btn.classList.add('active');
        currentCatKanji = btn.dataset.cat;
      }
      renderListKanji();
    });

    // ─── Kanji search ───
    document.getElementById('searchInputKanji').addEventListener('input', (e) => {
      searchQueryKanji = e.target.value.trim();
      renderListKanji();
    });

    // ─── Vocab card renderer ───
    function renderVocabCard(v) {
      const kanjiPart = v.kanji ? `<span class="vocab-kanji">【${v.kanji}】</span>` : '';
      const exampleHtml = v.example ? `
        <div class="vocab-example">
          <div class="vocab-example-ja">${v.example.ja}</div>
          <div class="vocab-example-reading">${v.example.reading}</div>
          <div class="vocab-example-ko">${v.example.ko}</div>
        </div>` : '';
      return `
        <div class="vocab-card">
          <div class="vocab-card-top">
            <span class="vocab-word">${v.word}</span>
            ${kanjiPart}
          </div>
          <div class="vocab-meaning">${v.meaning}</div>
          <div class="vocab-meta">
            <span class="vocab-meta-tag">${v.pos}</span>
            <span class="vocab-meta-tag">${v.category}</span>
          </div>
          ${exampleHtml}
        </div>`;
    }

    // ─── Vocab list ───
    function renderListVocab() {
      let filtered = vocabData;
      if (currentCatVocab !== 'all') {
        filtered = filtered.filter(v => v.category === currentCatVocab);
      }
      if (searchQueryVocab) {
        const q = searchQueryVocab.toLowerCase();
        filtered = filtered.filter(v =>
          v.word.toLowerCase().includes(q) ||
          (v.kanji && v.kanji.toLowerCase().includes(q)) ||
          v.meaning.includes(q) ||
          v.pos.includes(q) ||
          v.category.includes(q) ||
          (v.example && (v.example.ja.includes(q) || v.example.reading.includes(q) || v.example.ko.includes(q)))
        );
      }
      document.getElementById('countLabelVocab').textContent = `${filtered.length}개`;
      const listEl = document.getElementById('vocabList');
      if (filtered.length === 0) {
        listEl.innerHTML = '<div class="empty-state">검색 결과가 없습니다.</div>';
        return;
      }
      listEl.innerHTML = filtered.map(v => renderVocabCard(v)).join('');
    }

    // ─── Vocab level tabs ───
    document.getElementById('vocabLevelTabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.level-tab');
      if (!btn || !btn.dataset.level) return;
      if (btn.classList.contains('active')) return;
      document.querySelectorAll('#vocabLevelTabs .level-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentVocabLevel = btn.dataset.level;
      searchQueryVocab = '';
      document.getElementById('searchInputVocab').value = '';
      loadVocabLevel(currentVocabLevel);
    });

    // ─── Vocab filter ───
    document.getElementById('vocabFilter').addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn || btn.dataset.cat === undefined) return;
      const wasActive = btn.classList.contains('active') && btn.dataset.cat !== 'all';
      document.querySelectorAll('#vocabFilter .filter-btn').forEach(b => b.classList.remove('active'));
      if (wasActive) {
        currentCatVocab = 'all';
        document.querySelector('#vocabFilter .filter-btn[data-cat="all"]').classList.add('active');
      } else {
        btn.classList.add('active');
        currentCatVocab = btn.dataset.cat;
      }
      renderListVocab();
    });

    // ─── Vocab search ───
    document.getElementById('searchInputVocab').addEventListener('input', (e) => {
      searchQueryVocab = e.target.value.trim();
      renderListVocab();
    });

    // ─── Combined filter (행 + 타입, 한 줄) ───
    document.getElementById('combinedFilter').addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      if (btn.dataset.row !== undefined) {
        document.querySelectorAll('#combinedFilter .filter-btn[data-row]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentRow = btn.dataset.row;
        // "전체" 행 선택 시 타입 필터도 초기화
        if (btn.dataset.row === 'all') {
          document.querySelectorAll('#combinedFilter .filter-btn[data-filter]').forEach(b => b.classList.remove('active'));
          currentFilter = 'all';
        }
      } else if (btn.dataset.filter !== undefined) {
        // 타입 필터는 토글 방식 (다시 누르면 해제)
        const wasActive = btn.classList.contains('active');
        document.querySelectorAll('#combinedFilter .filter-btn[data-filter]').forEach(b => b.classList.remove('active'));
        if (wasActive) {
          currentFilter = 'all';
        } else {
          btn.classList.add('active');
          currentFilter = btn.dataset.filter;
        }
      }
      renderList();
    });

    document.getElementById('combinedFilterKata').addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      if (btn.dataset.row !== undefined) {
        document.querySelectorAll('#combinedFilterKata .filter-btn[data-row]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentRowKata = btn.dataset.row;
        if (btn.dataset.row === 'all') {
          document.querySelectorAll('#combinedFilterKata .filter-btn[data-filter]').forEach(b => b.classList.remove('active'));
          currentFilterKata = 'all';
        }
      } else if (btn.dataset.filter !== undefined) {
        const wasActive = btn.classList.contains('active');
        document.querySelectorAll('#combinedFilterKata .filter-btn[data-filter]').forEach(b => b.classList.remove('active'));
        if (wasActive) {
          currentFilterKata = 'all';
        } else {
          btn.classList.add('active');
          currentFilterKata = btn.dataset.filter;
        }
      }
      renderListKata();
    });

    // ─── Search ───
    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderList();
    });

    document.getElementById('searchInputKata').addEventListener('input', (e) => {
      searchQueryKata = e.target.value.trim();
      renderListKata();
    });

    // ─── Progress (localStorage) ───
    function updateProgress() {
      const kanjiTotal = Object.values(kanjiCache).reduce((s, d) => s + d.length, 0) || kanjiData.length;
      const vocabTotal = Object.values(vocabCache).reduce((s, d) => s + d.length, 0) || vocabData.length;
      const total = hiraganaData.length + katakanaData.length + kanjiTotal + vocabTotal;
      let learned = 0;
      try {
        const saved = JSON.parse(localStorage.getItem('jp_progress') || '{}');
        learned = Object.keys(saved.hiragana || {}).length + Object.keys(saved.katakana || {}).length + Object.keys(saved.kanji || {}).length + Object.keys(saved.vocab || {}).length;
      } catch (e) {}
      const pct = total > 0 ? Math.round((learned / total) * 100) : 0;
      const el = document.getElementById('totalProgress');
      if (el) el.style.width = pct + '%';
      const label = document.getElementById('progressLabel');
      if (label) label.textContent = `${learned} / ${total} 항목 학습`;
      const pctEl = document.getElementById('progressPct');
      if (pctEl) pctEl.textContent = pct + '%';
    }

    // ─── Stroke SVG loading ───
    // svgCache: 원본 SVG 텍스트 (애니메이션 포함)
    const svgCache = {};

    // SVG에서 모든 애니메이션 요소를 제거하여 정적 완성 글자로 만듦
    function stripAnimations(svgEl) {
      svgEl.querySelectorAll('animate, animateTransform, set, animateMotion').forEach(a => a.remove());
      // clip-path로 가려진 획을 모두 보이게: stroke-dasharray/dashoffset 초기화
      svgEl.querySelectorAll('path[clip-path]').forEach(p => {
        p.style.strokeDasharray = 'none';
        p.style.strokeDashoffset = '0';
        p.style.opacity = '1';
      });
    }

    // 정적 SVG 삽입 (애니메이션 없이 완성된 글자만 표시)
    function insertStaticSvg(box, svgText) {
      const hint = '<span class="replay-hint" onclick="event.stopPropagation(); replayStroke(this.parentNode)">▶</span>';
      box.innerHTML = svgText + hint;
      const svg = box.querySelector('svg.acjk');
      if (svg) stripAnimations(svg);
    }

    async function loadStrokeSvg(box) {
      const code = box.dataset.unicode;
      if (!code) return;
      const svgDir = box.dataset.svgDir || 'kana-svg';
      const cacheKey = svgDir + '/' + code;

      if (svgCache[cacheKey]) {
        insertStaticSvg(box, svgCache[cacheKey]);
        return;
      }

      try {
        const resp = await fetch(`assets/${svgDir}/${code}.svg`);
        if (!resp.ok) {
          const ch = String.fromCodePoint(parseInt(code));
          box.outerHTML = `<div class="char-text-fallback">${ch}</div>`;
          return;
        }
        const text = await resp.text();
        svgCache[cacheKey] = text;
        insertStaticSvg(box, text);
      } catch (e) {
        const ch = String.fromCodePoint(parseInt(code));
        box.outerHTML = `<div class="char-text-fallback">${ch}</div>`;
      }
    }

    function replayStroke(box) {
      const code = box.dataset.unicode;
      const svgDir = box.dataset.svgDir || 'kana-svg';
      const cacheKey = svgDir + '/' + code;
      const cached = svgCache[cacheKey];
      if (!cached) {
        loadStrokeSvg(box);
        return;
      }
      // 원본(애니메이션 포함) SVG를 다시 삽입 → 해당 박스만 재생
      const hint = '<span class="replay-hint" onclick="event.stopPropagation(); replayStroke(this.parentNode)">▶</span>';
      box.innerHTML = cached + hint;
    }

    // Intersection Observer로 화면에 보이면 SVG 로드
    function observeStrokeBoxes() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const box = entry.target;
            if (!box.querySelector('svg.acjk')) {
              loadStrokeSvg(box);
            }
            observer.unobserve(box);
          }
        });
      }, { rootMargin: '200px' });

      document.querySelectorAll('.stroke-box').forEach(box => observer.observe(box));
    }

    // renderList 후 SVG observer 시작
    const origRenderList = renderList;
    renderList = function() {
      origRenderList();
      requestAnimationFrame(() => observeStrokeBoxes());
    };

    const origRenderListKata = renderListKata;
    renderListKata = function() {
      origRenderListKata();
      requestAnimationFrame(() => observeStrokeBoxes());
    };

    const origRenderListKanji = renderListKanji;
    renderListKanji = function() {
      origRenderListKanji();
      requestAnimationFrame(() => observeStrokeBoxes());
    };

    // ─── Init ───
    loadData();
  </script>
</body>
</html>
